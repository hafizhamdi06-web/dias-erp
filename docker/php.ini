; DIAS ERP runtime overrides.
; Loaded AFTER php.ini default di image php:8.2-fpm-alpine via conf.d/zz-dias.ini
; (nama "zz-" agar override terakhir).

; Memory & execution — laporan PDF besar (mpdf, ribuan baris) butuh ini.
; PdfReport::make() sudah men-set memory_limit 512M scope-per-request, ini nilai
; default proses PHP nya.
memory_limit = 512M
max_execution_time = 120

; Upload cukup besar untuk paket/batch input.
upload_max_filesize = 20M
post_max_size = 20M

; OPcache untuk production.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

; Default error display off — di-handle oleh Laravel.
display_errors = Off
display_startup_errors = Off
log_errors = On

; date.timezone TIDAK di-override - Laravel config/app.php memakai timezone
; UTC (hardcode, sama dgn dev), jadi tanggal di aplikasi tidak bergantung TZ container.
