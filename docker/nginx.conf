user www-data;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log ke docker stdout/stderr -> docker logs.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Keamanan global (lihat laravel.com/docs/12.x/deployment "Nginx"):
    #   - X-Powered-By sengaja disembunyikan (server_tokens off di atas + hide header di fastcgi).
    #   - charset utf-8 default untuk semua response.
    charset utf-8;

    server {
        # IPv4 saja - Traefik menjangkau lewat network docker; listen [::] gagal
        # kalau IPv6 dimatikan di host.
        listen 80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Upload limit sama dgn php.ini.
        client_max_body_size 20m;

        # Header keamanan. Traefik bisa menimpa ini ke depan, tapi di-set di sini
        # juga supaya defense-in-depth kalau Traefik tidak dikonfigurasi ulang.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Hidden files: .env, .git, dll TIDAK boleh diakses.
        location ~ /\. {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Hanya /index.php yg dieksekusi sbg PHP - pola docs Laravel. Cegah file
        # .php lain di public/ (mis. /vendor/x.php atau upload berbahaya berakhir
        # di public/) dieksekusi sbg script. /index.php/foo cocok utk Livewire
        # updates (path info dipakai router Laravel).
        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;

            # TLS diterminasi Traefik; semua trafik publik memang HTTPS.
            fastcgi_param HTTPS on;

            # Laporan PDF mpdf ribuan baris butuh waktu; default 60s tidak cukup.
            fastcgi_read_timeout 120;

            # Sembunyikan X-Powered-By kalau PHP menambahkannya.
            fastcgi_hide_header X-Powered-By;
        }

        # Static assets: file fisik di public/ disajikan langsung + cache. Yang TIDAK
        # ada sebagai file (mis. /livewire/livewire.min.js - disajikan route Laravel)
        # WAJIB jatuh ke index.php, bukan 404, atau seluruh Workspace Livewire mati.
        location ~* \.(?:css|js|map|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            access_log off;
            try_files $uri /index.php?$query_string;
        }
    }
}
